name: cmd-orchestrator
version: 1.1.0
description: "Multi-model orchestration for Hermes with visible task/model plans, operator route overrides, Hermes model discovery, durable checkpoints, resume, verification tracking, learning, and Apple Intelligence fm rescue."
provides_tools:
  - cmd_orchestrate
  - cmd_plan
  - cmd_route
  - cmd_models_refresh
  - cmd_learning_stats
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - api_request_error
capabilities:
  - llm.model_override
  - llm.provider_override
