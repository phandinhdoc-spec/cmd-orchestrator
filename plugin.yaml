name: cmd-orchestrator
version: 1.3.0
description: "Hermes control plane with library-first atomic multi-agent execution: full Grill prompt review, detailed task/work_unit/step visibility, human edits and model overrides, durable execution state, teachable learning, and local rescue. Hermes remains the orchestrator."
provides_tools:
  - cmd_prompt_capture
  - cmd_prompt_select
  - cmd_capture_plan
  - cmd_plan_patch
  - cmd_approve_run
  - cmd_unit_update
  - cmd_complete_run
  - cmd_learning_capture
  - cmd_learning_context
  - cmd_models_refresh
  - cmd_ready_batch
  - cmd_orchestrate
  - cmd_route
  - cmd_learning_stats
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - on_session_start
  - on_session_end
  - api_request_error
capabilities:
  - llm.model_override
  - llm.provider_override
